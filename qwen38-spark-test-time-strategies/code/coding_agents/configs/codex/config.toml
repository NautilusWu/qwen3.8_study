model = "qwen3.8-27b-tensorfold-nvfp4"
model_provider = "local"
model_context_window = 262144

[model_providers.local]
name = "local TensorFold via normalizing proxy"
base_url = "http://127.0.0.1:8099/v1"
wire_api = "responses"
env_key = "LOCAL_API_KEY"

# OpenAI-cloud-only tool types TensorFold cannot run: hosted web search and the namespaced sub-agent tools.
web_search = "disabled"

[features]
multi_agent = false
